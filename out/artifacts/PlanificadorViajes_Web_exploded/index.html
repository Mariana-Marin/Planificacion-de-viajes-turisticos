<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Registro de Viaje</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="form-container">
    <h1>🌍 <span>Mundo</span><br><span>Aventurero</span></h1>
    <form action="PaqueteServlet" method="post" id="formulario">

      <div class="field-group">
        <i class="fas fa-user"></i>
        <input type="text" name="cliente" id="cliente" placeholder="Nombre del cliente" required>
        <small></small>
      </div>

      <div class="field-group">
        <i class="fas fa-users"></i>
        <input type="number" name="personas" id="personas" placeholder="Número de personas" required>
        <small></small>
      </div>

      <div class="field-group">
        <i class="fas fa-map-marker-alt"></i>
        <select name="destino" id="destino" required>
          <option value="">Destino</option>
          <option value="Cancún">Cancún</option>
          <option value="Cartagena">Cartagena</option>
          <option value="Madrid">Madrid</option>
          <option value="Paris">Paris</option>
          <option value="Roma">Roma</option>
          <option value="Miami">Miami</option>
        </select>
        <small></small>
      </div>

      <div class="field-group">
        <i class="fas fa-dollar-sign"></i>
        <input type="number" name="precioPersona" id="precioPersona" placeholder="Precio por persona" required>
        <small></small>
      </div>

      <label class="checkboxes">
        <input type="checkbox" name="seguro"> Incluir seguro
      </label>

      <button type="submit">Calcular</button>
    </form>
  </div>

  <div class="star-container"></div>
  <script src="validation.js"></script>
  <script src="stars.js"></script>
</body>

</html>
